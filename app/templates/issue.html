{% extends "base.html" %}
{% block title %}Выдать книгу{% endblock %}
{% block content %}
<h2>Выдать экземпляр читателю</h2>
{% if error %}<p class="error">Отказ: {{ error }}</p>{% endif %}
<form method="post" action="/loans/new">
  <p><label>Номер читателя <input name="reader_id" type="number" value="{{ reader_id }}" required></label></p>
  <p><label>Номер экземпляра <input name="copy_id" type="number" value="{{ copy_id }}" required></label></p>
  <button>Выдать</button>
</form>
<p class="muted">Экземпляр выдаётся, если он свободен и у читателя нет просроченных выдач. Срок — 14 дней.</p>
{% endblock %}
